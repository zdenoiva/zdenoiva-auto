<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body, #mapa { height: 100%; margin: 0; }
  #panel {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 14px;
    background: #fff; font-family: system-ui, sans-serif;
    box-shadow: 0 -2px 10px rgba(0,0,0,.25); z-index: 1000;
  }
  #text { margin-bottom: 10px; font-size: 14px; color: #444; }
  button {
    padding: 14px; font-size: 16px; font-weight: bold; width: 100%;
    background: #0B7A3B; color: #fff; border: 0; border-radius: 8px;
  }
</style>
</head>
<body>
<div id="mapa"></div>
<div id="panel">
  <div id="text">Ťukni na mapu a vyber miesto práce.</div>
  <button id="ulozit" style="display:none" onclick="ulozit()">Uložiť toto miesto</button>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  var mapa = L.map('mapa', {zoomControl: true}).setView([48.7164, 21.2611], 13);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap'
  }).addTo(mapa);

  var znacka = null;
  var vyber = null;

  function nastavStred(lat, lon, zoom) {
    mapa.setView([lat, lon], zoom);
  }

  function nastavBod(lat, lon, zoom) {
    if (znacka) mapa.removeLayer(znacka);
    znacka = L.marker([lat, lon]).addTo(mapa);
    vyber = { lat: lat, lng: lon };
    mapa.setView([lat, lon], zoom || 16);
    document.getElementById('text').textContent =
      'Vybrané: ' + lat.toFixed(6) + ', ' + lon.toFixed(6);
    document.getElementById('ulozit').style.display = 'block';
  }

  mapa.on('click', function (e) {
    nastavBod(e.latlng.lat, e.latlng.lng, mapa.getZoom());
  });

  function ulozit() {
    if (!vyber) return;
    location.href = 'vyber://ulozit?lat=' + vyber.lat + '&lon=' + vyber.lng;
  }
</script>
</body>
</html>
