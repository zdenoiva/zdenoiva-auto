name: automatizácia

on:
  schedule:
    # GitHub nespúšťa cron presne — bežne mešká hodiny a meškanie sa mení.
    # Preto je tu 14 pokusov denne (10:00–16:30 UTC). Skutočný zápis urobí len
    # ten beh, ktorý naštartuje medzi 16:30 a 22:45 miestneho času; ostatné
    # skončia hneď a bez akcie. Podrobnosti v auto.py.
    - cron: '*/30 10-16 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Len načítať stav, nič nezapisovať'
        type: boolean
        default: false

permissions:
  contents: read

# Dva behy naraz nemajú zmysel — druhý by len videl už zapísaný odchod.
concurrency:
  group: webbox-odchod
  cancel-in-progress: false

jobs:
  odchod:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      USERNAME: ${{ secrets.USERNAME }}
      PASSWORD: ${{ secrets.PASSWORD }}
      DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
    steps:
      - name: 📦 Checkout kód
        uses: actions/checkout@v4

      - name: 🐍 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: 📋 Závislosti
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🤖 Odchod
        run: python -u auto.py

      - name: 📸 Diagnostika pri chybe
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostika
          path: |
            *.png
            *.html
          retention-days: 7
          if-no-files-found: ignore
