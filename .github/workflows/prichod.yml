name: príchod

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = ranná kontrola a mail, record = zapísať príchod, test = skúšobný mail'
        type: choice
        options:
          - check
          - record
          - test
          - smtp
        default: check
      dry_run:
        description: 'Len overiť stav, nič neposielať a nič nezapisovať'
        type: boolean
        default: false

permissions:
  contents: read

# Kontrola a zápis sa nesmú prekrývať (dva behy naraz nemajú zmysel).
concurrency:
  group: webbox-prichod
  cancel-in-progress: false

jobs:
  prichod:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      USERNAME: ${{ secrets.USERNAME }}
      PASSWORD: ${{ secrets.PASSWORD }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      CONFIRM_URL: ${{ secrets.CONFIRM_URL }}
      DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
    steps:
      - name: 📦 Checkout kód
        uses: actions/checkout@v7

      - name: 🐍 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: 📋 Závislosti
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🤖 Príchod
        run: python -u prichod.py ${{ inputs.mode }}

      - name: 📸 Diagnostika pri chybe
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostika-prichod
          path: |
            *.png
            *.html
          retention-days: 7
          if-no-files-found: ignore
